{% extends "templates/p4s_base.html" %}

{% block p4s_content %}
<div id="p4s-loading" class="p4s-muted">Loading…</div>

<form id="settings-form" class="p4s-form-stack p4s-hidden" autocomplete="off" novalidate>
	<div class="p4s-field">
		<label for="webhook">Webhook</label>
		<input id="webhook" name="webhook" maxlength="140">
	</div>
	<label class="p4s-check"><input type="checkbox" id="enable_webhook"> Enable Webhook</label>

	<div class="p4s-field">
		<label for="api_token">API Token</label>
		<input id="api_token" name="api_token" maxlength="140">
	</div>
	<label class="p4s-check"><input type="checkbox" id="enable_api"> Enable API</label>

	<div class="p4s-field">
		<label for="ip_address">IP Address</label>
		<textarea id="ip_address" name="ip_address" rows="6"></textarea>
	</div>
	<label class="p4s-check"><input type="checkbox" id="enable_ip_address"> Enable IP Address</label>

	<div class="p4s-field">
		<label for="webhook_secret">Webhook Secret</label>
		<input id="webhook_secret" name="webhook_secret" maxlength="140">
	</div>

	<div class="p4s-form-actions">
		<button type="button" class="p4s-btn" id="discard-btn">Discard</button>
		<button type="submit" class="p4s-btn p4s-btn-primary" id="save-btn">Save</button>
	</div>
</form>
{% endblock %}

{% block p4s_script %}
<script>
(function () {
	const $ = (id) => document.getElementById(id);
	const form = $("settings-form");
	const TEXT = ["webhook", "api_token", "ip_address", "webhook_secret"];
	const CHECKS = ["enable_webhook", "enable_api", "enable_ip_address"];

	function fill(s) {
		TEXT.forEach((f) => { $(f).value = s[f] || ""; });
		CHECKS.forEach((f) => { $(f).checked = !!Number(s[f]); });
	}

	async function load() {
		try {
			const r = await P4S.call("pay4sync.api.settings.get_settings");
			fill(r.data);
			$("p4s-loading").classList.add("p4s-hidden");
			form.classList.remove("p4s-hidden");
		} catch (e) {
			$("p4s-loading").textContent = e.message;
		}
	}

	$("discard-btn").addEventListener("click", () => { P4S.hideAlert(); load(); });

	form.addEventListener("submit", async (ev) => {
		ev.preventDefault();
		P4S.hideAlert();
		const data = {};
		TEXT.forEach((f) => { data[f] = $(f).value.trim(); });
		CHECKS.forEach((f) => { data[f] = $(f).checked ? 1 : 0; });
		try {
			const r = await P4S.busy($("save-btn"),
				P4S.call("pay4sync.api.settings.update_settings", data, "POST"), "Saving…");
			fill(r.data);
			P4S.showAlert("Saved", "success");
		} catch (e) {
			P4S.showAlert(e.message);
		}
	});

	load();
})();
</script>
{% endblock %}
