{% extends "templates/p4s_auth_base.html" %}

{% block p4s_auth_content %}
<form id="reset-form" novalidate>
	<p class="p4s-login-text">Choose a new password (at least 8 characters).</p>
	<div class="p4s-field">
		<label for="new_password">New Password</label>
		<input id="new_password" type="password" autocomplete="new-password" autofocus required>
	</div>
	<div class="p4s-field">
		<label for="confirm_password">Confirm New Password</label>
		<input id="confirm_password" type="password" autocomplete="new-password" required>
	</div>
	<button type="submit" class="p4s-btn p4s-btn-primary" id="reset-btn">Set new password</button>
</form>
<div class="p4s-login-help" id="done-link" hidden><a href="/login">Go to login</a></div>
{% endblock %}

{% block p4s_auth_script %}
<script>
(function () {
	const $ = (id) => document.getElementById(id);
	const key = new URLSearchParams(window.location.search).get("key") || "";
	if (!key) {
		$("reset-form").hidden = true;
		$("done-link").hidden = false;
		P4S.showAlert("This reset link is invalid or has expired. Please request a new one.");
		return;
	}
	$("reset-form").addEventListener("submit", async (ev) => {
		ev.preventDefault();
		P4S.hideAlert();
		const pwd = $("new_password").value;
		if (pwd.length < 8) return P4S.showAlert("Password must be at least 8 characters long.");
		if (pwd !== $("confirm_password").value) return P4S.showAlert("The two passwords do not match.");
		try {
			await P4S.busy($("reset-btn"),
				P4S.call("pay4sync.api.auth.reset_password", { key, new_password: pwd }, "POST"), "Saving…");
			$("reset-form").hidden = true;
			$("done-link").hidden = false;
			P4S.showAlert("Your password has been changed. Please log in with the new password.", "success");
		} catch (e) {
			P4S.showAlert(e.message);
		}
	});
})();
</script>
{% endblock %}
