{% extends "templates/p4s_auth_base.html" %}

{% block p4s_auth_content %}
<form id="forgot-form" novalidate>
	<p class="p4s-login-text">Enter the email you use to log in. We will email you a link to set a new password.</p>
	<div class="p4s-field">
		<label for="email">Email</label>
		<input id="email" type="email" autocomplete="username" autofocus required>
	</div>
	<button type="submit" class="p4s-btn p4s-btn-primary" id="send-btn">Send reset link</button>
</form>
<div class="p4s-login-help"><a href="/login">Back to login</a></div>
{% endblock %}

{% block p4s_auth_script %}
<script>
(function () {
	const $ = (id) => document.getElementById(id);
	$("forgot-form").addEventListener("submit", async (ev) => {
		ev.preventDefault();
		P4S.hideAlert();
		const email = $("email").value.trim();
		if (!email) return P4S.showAlert("Please enter your email.");
		try {
			const r = await P4S.busy($("send-btn"),
				P4S.call("pay4sync.api.auth.send_reset_link", { email }, "POST"), "Sending…");
			P4S.showAlert(r.message, "success");
			$("forgot-form").hidden = true;
		} catch (e) {
			P4S.showAlert(e.message);
		}
	});
})();
</script>
{% endblock %}
